name: CI/CD Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-id: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting Checks
        run: npm run lint

      - name: Compile Application
        run: npm run build
